technical_description:
  source: philharmonie_online
  summary: "One-keyboard clavichord with oak case veneered in walnut and lock; softwood bottom; softwood soundboard, possibly spruce; two parchment roses; walnut-veneered three-part lid with flap; reversed keyboard with ebony naturals and blackened-wood sharps covered with bone; brass tangents and hinges; stained beech stand with drawer and four curved legs. Compass FF-f3, one 8' register, two strings per note."

