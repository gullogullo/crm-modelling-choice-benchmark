technical_description:
  source: vam_online
  summary: "Oak undecorated bentside spinet with probably original four-legged turned stand. Soundboard probably stained pine; ebony naturals, ivory accidentals; iron lid hinges and brass keyboard-cover hinges. The two lowest accidentals are split into front and back parts, preserving transitional short-octave/chromatic keyboard practice."

contextual_history:
- source: vam_online
  topic: "English bentside spinet development"
  summary: "The V&A describes the spinet as a small wing-shaped keyboard instrument developed in Italy in the 1630s and appearing in England in the 1660s. John Player's London instruments are described as among the earliest surviving English examples."
  claim_scope: "instrument-type and maker context"
- source: vam_online
  topic: "John Player and split sharps"
  summary: "The V&A notes that John Player's only dated instrument was made in 1664 and that he seems to have died around 1705. Split bass sharps are described as characteristic of Player's instruments and are mentioned in a 1712 letter as split or quarter notes."
  claim_scope: "maker and technical context"

