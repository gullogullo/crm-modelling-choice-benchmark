notes_for_musicologist:
- "Medium record with accepted maker, production place, inscription, material details, dimensions, parts, and keyboard-feature evidence, but minimal provenance."
- "Do not treat the stand simply as certainly original: the V&A says it is probably original."
- "Do not treat pine and gesso as fully certain: the soundboard is probably stained pine, and the key-front composition is perhaps gesso."
- "The broader date 1675-1700 and the narrower labels 1680-85/about 1680 are compatible dating granularities, not a direct contradiction."
- "Preserve the object as multi-part: spinet, stand, and jacks."
- "Preserve the V&A working-database caveat when assessing completeness and defensibility."
