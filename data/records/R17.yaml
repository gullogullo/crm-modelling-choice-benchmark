technical_description:
  source: bmo_online
  summary: "Rectangular virginal by Andreas Ruckers, dated 1613, authenticated by O’Brien as 1613b AR. Compass C/E-c3 with short octave; disposition 1×8'; pitch R+5, quint pitch; scale 243 mm. Naturals are bone and sharps bog oak. Original scalings survive, but papers and soundboard decoration are lost. The case has been repainted, with original green or possibly red porphyry marble decoration visible through cracks. Rose with seated harping figure."

