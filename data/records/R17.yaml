notes_for_musicologist:
- "Medium/substantial authenticated Ruckers record with accepted maker, date, place, measurements, keyboard materials, provenance names, and current-state evidence."
- "Do not treat this as an attribution conflict: the BMO record presents Andreas Ruckers as maker and reports authentication by O’Brien."
- "Preserve the current-state alterations: lost papers, lost soundboard decoration, repainted case, and original jacks now leathered."
- "Preserve the uncertainty in the original marble decoration colour: green or possibly red."
- "Treat provenance as incomplete because M. Haveaux and C. Snoeck are listed without dates or transfer details."
- "The references listed by BMO were not independently consulted and should not be used as direct evidence beyond claims reported in the BMO record."
