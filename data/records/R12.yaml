notes_for_musicologist:
- "Rich hybrid-instrument record: combined grand pianoforte and two-manual harpsichord with four-manual configuration."
- "Do not classify this simply as a harpsichord or simply as a piano; preserve the combined harpsichord-piano identity."
- "Preserve Stein as maker and Augsburg as production place."
- "Preserve the current holding/ownership complexity: Museo Civico, Museo di Castelvecchio, and Società Filarmonica all appear in the BMO record with different roles."
- "Preserve the removed coupling action as a historical/current-state issue, but note that the statement comes from a contributor interpretation."
- "Do not infer key materials from black naturals and white sharps; the supplied record gives colour, not material."
- "The references listed in BMO were not independently consulted and should not be used as direct evidence in gold data."
