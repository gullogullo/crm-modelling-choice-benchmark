technical_description:
  source: bmo_online
  summary: "Rectangular-shaped instrument combining a grand pianoforte with a two-manual harpsichord. The keyboards are at each end of the rectangle. At one end are the two harpsichord manuals plus a third manual controlling the piano by stickers; at the other end is the piano alone. The harpsichord has 1×16', 2×8', and 1×4' choirs, five hand stops, and a harp stop. Plain wood case raised on six turned legs."

