notes_for_musicologist:
- "Rich record: named maker, exact date, maker inscription, restoration inscription, multiple provenance agents, exhibition history, measurements, and substantial secondary literature."
- "Do not collapse maker, restorer, and restoration director: Cristofori, Ponsicchi, and Sachs have distinct roles."
- "Preserve the 1875 restoration and 1938 Met restoration as historical state/conservation events."
- "Preserve Pollens's claim that the hammer mechanism was grossly altered before 1875, but keep the responsible agent unknown."
- "The Met bibliography is very large; only the listed consulted excerpts should be used as evidence in this draft."
- "The formal Hornbostel-Sachs classification was not present in the supplied page excerpt; the current hs_codes field records the object type only."
