historical_states:
- state_type: original_compass
  description: "Original compass described as FF, GG, AA to c, with FF# and GG# omitted."
  epistemic_status: asserted
  confidence: asserted
  source: pollens2013_excerpt
  comment: "Pollens compares the compass of a clavichord attributed to Cristofori with the original compass of the 1720 Met pianoforte."
- state_type: altered_compass
  description: "Compass altered to C to f."
  epistemic_status: asserted
  confidence: asserted
  source: pollens2013_excerpt
  comment: "Pollens states that the 1720 Met pianoforte had this alteration after its original compass."
- state_type: altered_action
  description: "Hammer mechanism altered through removal of wood from each hammer butt, removal of hammer pivot rods, and independent suspension of each hammer from leather hinges."
  epistemic_status: asserted
  confidence: probable
  source: pollens2002_excerpt
  comment: "Pollens argues that this alteration appears earlier than 1875."

