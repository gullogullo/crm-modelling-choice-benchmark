technical_description:
  source: met_online
  summary: "Cristofori pianoforte dated 1720; described by the Met as the oldest surviving piano and one of three surviving instruments from Cristofori's workshop. It has a shorter keyboard than later pianos, no pedals for tonal contrast, and three distinct registers."

contextual_literature:
- source: pollens2013_excerpt
  topic: "Cristofori compass and related instruments"
  summary: "Pollens discusses the original compass of the 1720 Met pianoforte and its later alteration, in relation to other instruments attributed to or associated with Cristofori."
  claim_scope: "object-specific and comparative context"
- source: pollens2002_excerpt
  topic: "Ponsicchi restoration and later action history"
  summary: "Pollens discusses Ponsicchi's 1875 restoration, the 1876 Florence exhibition, a later 1938 Met restoration under Curt Sachs, and earlier alteration of the hammer mechanism."
  claim_scope: "object-specific restoration/action history"
- source: pollens1985_excerpt
  topic: "Cristofori model and early Portuguese pianos"
  summary: "Pollens identifies the 1720 Cristofori piano at the Met as a model for early Portuguese pianos and comments on comparable sound qualities and construction features."
  claim_scope: "comparative context"

