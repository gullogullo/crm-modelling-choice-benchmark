technical_description:
  source: versailles_online
  summary: "Harpsichord originally built by Ioannes Rückers in Antwerp in 1628, modified or ravalé in 1706 by Nicolas Blanchet, with the case redecorated by Claude III Audran; nineteenth-century stand. Materials include painted and gilded poplar, oak, spruce, fruitwood, beech, lime, walnut, sculpted and gilded wood, and brass."

