notes_for_musicologist:
- "Rich historical-state record: original Rückers construction, 1706 ravalement attributed to Blanchet, redecoration by Audran, nineteenth-century stand, and later museum provenance/deposit."
- "Do not treat 1628-1706 as a single undifferentiated creation date. Split into original construction and later modification/redecoration events."
- "Do not collapse Ioannes Rückers, Nicolas Blanchet, and Claude III Audran into one maker role."
- "The Blanchet mechanism claim is attributed, not simply asserted as direct authorship."
- "Preserve the nineteenth-century stand as a later component/state."
