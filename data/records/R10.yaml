notes_for_musicologist:
- "Rich historical-state record closely comparable to R09: original Ruckers construction, Taskin ravalement, later restorations, and modern facsimile mechanism."
- "Do not treat 1646 and 1780 as a single undifferentiated creation date. Split original construction from later ravalement/modification."
- "Do not collapse Andreas II Ruckers, Pascal Taskin, Tomasini, Bédard, and Atelier von Nagel into one maker role."
- "Preserve the 1990 facsimile mechanism as part of the current state of the object."
- "The provenance chain is rich but mostly undated; the 1962 purchase note needs further checking if it becomes important."
- "The extensive documentation bibliography was not consulted and should not be used as direct evidence in gold data."
