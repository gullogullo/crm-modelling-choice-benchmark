technical_description:
  source: philharmonie_online
  summary: "Two-manual harpsichord with three ranks of strings, 2 x 8' and 1 x 4', manual lute stop, registration and coupling by knee levers, six knee levers, current compass FF to f''', 61 notes. Taskin modifications include buffalo-leather register jacks, changes to high-treble nuts and bridges, knee-lever mechanism, remade bracing, and thickened sides. The instrument has a facsimile mechanism by Atelier von Nagel from 1990."

