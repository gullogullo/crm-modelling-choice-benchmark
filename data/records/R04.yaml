- "The accepted catalogue maker remains anonymous. The Schmahl attribution belongs to contextual literature about the instrument type and should not be converted into an accepted object-specific maker unless further source checking confirms it."
- "Treat Southern Germany as the only object-specific possible production place from the consulted catalogue record. Treat Switzerland as contextual class-level evidence from Latcham, not as this object's production place."
- "The title Piano and alternative title Lying-harp piano should be preserved as an identity/type nuance, not as a classification conflict."
- "Most Rijksmuseum documentation references were not consulted and should not be used as evidence in gold data."
