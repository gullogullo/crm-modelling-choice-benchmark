notes_for_musicologist:
- "Rich contested-attribution and composite-instrument record."
- "Do not treat Bonafinis as an uncontested maker: the BMO maker field is explicitly attributed, and the object was formerly attributed to Alexander Bertoloti/Bortolotti."
- "Preserve the inscription-layering problem: visible Bortolotti inscription, possible underlying Bonafinis inscription, and uncertain readings by different scholars."
- "Preserve the organ part as a later or distinct component associated with W. S. Gut and an uncertain 1657/1677 date."
- "Do not classify this simply as a harpsichord: it is a claviorgan combining harpsichord and organ components."
- "Do not infer key materials from white naturals and black sharps."
- "The references listed by BMO were not independently consulted and should not be used as direct evidence beyond the claims reported in the BMO record."
