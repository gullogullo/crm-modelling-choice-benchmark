technical_description:
  source: bmo_online
  summary: "One-manual claviorgan with rectangular carved box case. Harpsichord part has a plain cypress case and disposition 1×8' and 1×4'. It stands on an organ part built by W. S. Gut, dated uncertainly to 1657 or 1677, with compass C-c3 and specification 4' wood, quint wood, and 2' metal, all operated by metal levers. Keyboard has white naturals and black sharps; catalogue compass is GG/BB-c3 with short octave."

