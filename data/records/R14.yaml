  source: bmo_online
  comment: "BMO gives maker as Bonafinis, Francesco (attr.), with variant names Bonafinis/Benismis and Francesco/Doanusa. Darryl Martin recommends attribution to Bonafinis based on the partially suppressed Bertolotti inscription and the lack of other evidence for Bertolotti."
- name: "Alexander Bertoloti / Bortolotti"
  role: formerly_attributed_maker
  epistemic_status: contested
  confidence: formerly_attributed
  source: bmo_online
  comment: "The object was attributed to Alexander Bertoloti in Boalch B3, Russell 1959 plate 8, and other sources. The visible mark reads Alexander Bortolotti MDLXXXV, but the BMO remarks caution against accepting this as the maker attribution."
- name: "Theodorus Wilhelmus Sigismundus Gut"
  role: organ_part_maker
  epistemic_status: asserted
  confidence: uncertain_inscription_reading
  source: bmo_online
  comment: "The organ part is described as built by W. S. Gut, with an inscription on the organ reading Theodorus Wilhelmus Sigismundus and uncertain words/date, interpreted as Gottlob W. S. Gut. The date is uncertain between 1657 and 1677."

