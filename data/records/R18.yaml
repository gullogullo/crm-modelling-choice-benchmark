technical_description:
  source: mimo_minim_online
  summary: "Single-manual Flemish harpsichord by Andreas Ruckers, dated 1609, from Antwerp. Current compass 51 notes C2-D6 [C-d''']; current disposition 2 x 8-foot and 1 x 4-foot, with registers operated by brass handstops through the frontboard. Original compass C2/E2-C6 [C/E-c'''] and original disposition 8-foot + 4-foot. The original soundboard and decoration are in good condition, but the current instrument incorporates English eighteenth-century ravalement, probable replacement 8-foot bridge, Dolmetsch components, a post-1967 Clayson and Garrett keyboard, and 1996 revoicing."

