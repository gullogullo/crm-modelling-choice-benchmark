notes_for_musicologist:
- "Rich historical-state record: original Ruckers construction, eighteenth-century English ravalement, Dolmetsch rebuilding, post-1967 keyboard replacement, M. Rose repairs/restringing, and 1996 revoicing."
- "Do not treat the current three-register state as the original 1609 state; the original disposition was 8-foot + 4-foot."
- "Do not treat Kirckman as an accepted ravalement agent: the source says possibly by Kirckman."
- "Preserve current-versus-original compass separately."
- "Preserve the original soundboard and decoration as surviving in good condition, while distinguishing them from replaced or later components."
- "The supplied record gives no ownership/provenance chain; do not invent one."
