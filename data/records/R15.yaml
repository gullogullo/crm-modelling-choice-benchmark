technical_description:
  source: vam_online
  summary: "Composite claviorgan consisting of a harpsichord inset on top of a rectangular panelled organ case. The organ pipes were in the smaller middle/frieze section below the harpsichord and the bellows in the larger lower section. The instrument is richly decorated with painted and gilded oak, marbling, strapwork, coats of arms, leather covering, embossed paper lining, tempera-painted soundboard, and lid paintings including Orpheus and animals. It is now fragmentary and non-playable, with most strings, pipes, and organ workings lost."

