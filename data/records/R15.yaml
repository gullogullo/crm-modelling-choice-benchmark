notes_for_musicologist:
- "Rich fragmentary/composite claviorgan record: signed maker, exact date, London production, 41 parts, extensive materials and decoration, provenance hypotheses, and major current-state losses."
- "Do not classify this simply as a harpsichord or simply as an organ: it is a claviorgan combining both."
- "Preserve the fragmentary state: most strings, pipes, and organ workings are lost; the object is no longer playable."
- "Preserve the component/original-conception ambiguity: V&A/Rose commentary says it may never be possible to determine whether the whole instrument was conceived at once or whether the combination was an afterthought."
- "Preserve the armorial/provenance evidence as probabilistic: Roper, Hoby/Carey, and Selby/Ightham stages are not all equally certain."
- "Do not treat all repairs as precisely documented: 1874 repair is possible; post-1890 repairs are apparent/probable; exact interventions require further checking."
- "The V&A record is a working database record and includes a source caveat; the listed bibliography was not independently consulted."
