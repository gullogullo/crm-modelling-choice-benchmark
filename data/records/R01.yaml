notes_for_musicologist:
  - "Thin-control record in epistemic/provenance terms: anonymous maker and minimal provenance."
  - "Descriptive evidence is richer than the original thin draft because the historical catalogue supplies compass, material, and dimensional evidence."
  - "Research scope is catalogue-led: references are limited to those reported by the Met page, with no independent bibliographic search."
  - "Do not treat Italy vs probably Naples as a conflict: Naples is a qualified refinement within Italy."
  - "Do not treat current vs historical dimensions as a conflict unless further evidence shows that both sources measured the same part using the same convention."
  - "Do not use the unconsulted 1902 catalogue as evidence in gold data."
