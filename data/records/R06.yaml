technical_description:
  source: met_online
  summary: "Rectangular dark green painted case with gold trim on trestle stand; compass FF-f3; unfretted and double-strung; lowest 15 pairs wound; ebony naturals; stained accidental blocks with ivory plates; two soundholes with AD monogram and rosette; detached fallboard; brass strap hinges; folding music rack; lidded compartment; string gauge numbers and pitch letters stamped."

