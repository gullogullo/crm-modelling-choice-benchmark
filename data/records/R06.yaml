notes_for_musicologist:
- "Medium/substantial record with clear multi-agent production: Arnold Dolmetsch as designer/director and Chickering & Sons as manufacturer."
- "Do not collapse designer and manufacturer into a single maker role."
- "The 1907–8 catalogue date accommodates the markings MCMVIII and MCMVII (sic); preserve both markings as source-specific inscription evidence."
- "Do not treat the penciled A.D. Klemm(?) name as a maker claim without further evidence."
- "The listed Pollens reference was not consulted and should not be used as evidence in gold data."
