technical_description:
  source: met_online
  author: "Douglas Maple"
  date: "1983"
  summary: "Case of walnut or chestnut and lime; left rear corner angled; compass c/e-a3; bone naturals with wooden key fronts; dark-stained fruitwood accidentals; pear jacks with quill plectra, brass leaf springs, lead weights, leather guides, and pierced wood and parchment rose."

notes_for_musicologist:
- "This should not be a thin record: although maker and provenance are sparse, the record has substantial technical description and interpretive issues."
- "Treat Germany? and Augsburg? as compatible but differently granular place claims, not as a conflict."
- "Treat the Paspuino Querci / 1615 inscription as spurious inscription evidence, not as accepted maker or date evidence."
- "The former claviorganum relation makes this a D fragmentary/composite candidate."
- "Check whether Pollens's three-octave-span value '407' has units or table context before using it as a normalized measurement."
