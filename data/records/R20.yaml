notes_for_musicologist:
- "Rich record with accepted maker/date in the current catalogue, formal classification, display status, dimensions, restoration chain, historical refurbishment, historical measurements, and consulted historical catalogue excerpts."
- "Do not flatten the record to a single 1620 untouched Ruckers state: refurbishment, added bass notes, and multiple restorations are explicitly recorded."
- "Preserve the Hipkins discrepancy: the supplied excerpt reports Joannes Ruckers and Anno 1622, whereas current Carmentis and Mahillon support Andreas Ruckers and 1620."
- "Treat Hipkins's statement that the stand is original as historical-source evidence; current Carmentis excerpt does not independently describe the stand's originality beyond saying the muselar is on six legs."
- "Specific wood species and key materials are not fully supplied by the current Carmentis excerpt; do not over-normalize material claims from contextual discussion alone."
- "No acquisition or full provenance chain is supplied beyond current depository and owner."
