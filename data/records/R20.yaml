technical_description:
  source: carmentis_online
  summary: "Rectangular muselar virginal on six legs with serial number 6/27, built by Andreas Ruckers in 1620. The record states that refurbishment was probably completed by the end of the seventeenth century and lists restorations in 1847, 1885, 1936-1937, and 1982. Mahillon describes a painted soundboard with flowers, foliage, birds, and insects; printed paper decoration; Latin motto; and later-added bass notes."

