notes_for_musicologist:
- "Medium record with strong attribution and current-state issues."
- "Do not treat Luigi Fani as an uncontested maker: the maker is attributed and the inscription is barely legible."
- "Preserve the repair note Aprile/1769/rest. as repair evidence, but do not invent a repairer."
- "Separate current state from historical state: original keys have been lost since 1945, and the outer case is lost."
- "Treat ivory and ebony key materials as historical/lost-key evidence, not necessarily current-state materials."
- "Treat Franciolini as a probable intermediary, not as certain provenance."
- "The references listed by BMO were not independently consulted and should not be used as direct evidence beyond claims reported in the BMO record."
