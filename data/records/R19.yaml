notes_for_musicologist:
- "Medium record with detailed technical/material description, formal classification, broad date, broad production place, and attributed maker."
- "Do not treat Franciscus Poggio as an uncontested maker: the catalogue lists author unknown and Poggio only as attributed, with the attribution reported from Wraight."
- "Mahillon 1900 says sans nom d'auteur, compatible with the unresolved/attributed maker status."
- "Preserve the source discrepancy between current black-ground exterior description and Mahillon's green-ground exterior description."
- "The supplied Mahillon dimension transcription is too unclear to normalize safely."
- "No provenance or acquisition history is supplied beyond current depository and owner."
