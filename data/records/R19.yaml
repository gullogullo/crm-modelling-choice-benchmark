technical_description:
  source: carmentis_online
  summary: "Virginal with 1 x 8-foot disposition; beech keyboard with compass C/E-f3, 50 notes including six split keys; boxwood-plated naturals, blackened pearwood sharps, parchment and textile key fronts; pearwood jacks and tongues; leather plectra; cypress soundboard with parchment and wood gothic-pattern rose; beech bridge and nut; thin cypress sides, poplar bottom, and poplar outer case and lid with painted and gilded decoration."

