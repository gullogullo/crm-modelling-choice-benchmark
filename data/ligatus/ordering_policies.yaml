manifest_id: ligatus_episode_ordering_policies
version: "1.0"
primary_policy: source_semantics

semantic_rules:
  previous_repair_before_main_event:
    label: previous-repair/main-event semantics
    applies_when:
      exact_root_count: 2
      ordered_label_cues:
        - "previous repair"
        - "main conservation event"
    action: split

policies:
  all_roots_split:
    label: all roots split
    meaning: Old aggressive policy; every source-level E11 root becomes an episode.
    dated_roots_action: split
    semantic_rules: []
    unsupported_undated_action: split
  source_semantics:
    label: source semantics
    meaning: Split fully dated roots and configured source-semantic sequences; collapse unsupported undated roots.
    dated_roots_action: split
    semantic_rules:
      - previous_repair_before_main_event
    unsupported_undated_action: collapse
  dated_only:
    label: dated only
    meaning: Split roots only when every root has a supplied date boundary.
    dated_roots_action: split
    semantic_rules: []
    unsupported_undated_action: collapse
  collapse_all_undated:
    label: collapse all undated
    meaning: Split fully dated roots; collapse every root set containing an undated root.
    dated_roots_action: split
    semantic_rules: []
    unsupported_undated_action: collapse
