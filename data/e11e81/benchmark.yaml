benchmark_id: crm_identity_modelling_benchmark
benchmark_version: "1.0"
corpus_role: design_demonstration_corpus
title: CIDOC-CRM identity-modelling and attribution-retrieval sensitivity for historically restored/modified instruments
references:
  cidoc_crm_7_1_3: https://cidoc-crm.org/html/cidoc_crm_v7.1.3.html
  linked_art_production: https://linked.art/model/object/production/
  linked_art_physical_objects: https://linked.art/model/object/physical/
canonical_events:
  extraction_vocabulary: data/e11e81/extraction_vocabulary.yaml
  event_kind_review: data/e11e81/event_kind_review.yaml
  event_kind_rules:
    creation:
      state_type_terms: [original_construction, original_or_early_configuration, original_composite_instrument, attributed_original_state, original_or_early_harpsichord_state, catalogued_creation]
    part_addition:
      text_terms: [added, fitted, extension, replacement, replaced, rebuilt, facsimile]
    part_removal:
      text_terms: [removed, removal, lost, loss, missing]
    restoration:
      state_type_terms: [restoration, repair, refurbishment, ravalement, post_acquisition_repairs]
      text_terms: [restoration, restored, repair, repaired, refurbishment, ravalement]
    condition:
      text_terms: [damaged, fragmentary, non-playable, wreck, survives, current state]
    attribution_change:
      state_type_terms: [former_attribution_state]
      text_terms: [attributed, attribution, formerly attributed]
    classification_change:
      text_terms: [reclassified, classification, formerly part, once part]
    modification:
      default: true
profiles:
  profile_a:
    label: persistent-object E11 model
    builder: persistent_e11
    semantic_category: persistent_identity
    recommended_status: benchmark_profile
    primary_maker_query_family: maker_direct
  profile_b:
    label: segmented E81 model
    builder: segmented_e81
    semantic_category: segmented_identity
    recommended_status: benchmark_profile
    primary_maker_query_family: maker_lineage
  profile_c:
    label: segmented E81 plus E13 production-maker attribution
    builder: segmented_e81_e13
    semantic_category: segmented_with_explicit_attribution
    recommended_status: benchmark_profile
    primary_maker_query_family: maker_e13
  profile_d:
    label: propagated P108 diagnostic
    builder: segmented_e81_propagated_p108
    semantic_category: access_diagnostic
    recommended_status: diagnostic_not_recommendation
    primary_maker_query_family: maker_direct
parameter_space:
  source: configured_tier_sweeps
segmentation_scenarios:
  no_replacement:
    strategy: no_replacement
    interpretation: Persistent identity control independent of profile authoring.
  event_kind_boundaries:
    strategy: event_kind_boundaries
    boundary_event_kinds: [part_addition, part_removal]
    interpretation: Boundaries follow configured physical part-change event kinds.
  explicit_replacement_only:
    strategy: explicit_replacement_only
    boundary_terms: [replaced, replacement, rebuilt, transformed, converted]
    interpretation: Boundaries occur only where configured explicit replacement language is present.
  manual_curator_boundaries:
    strategy: manual_boundaries
    boundaries_by_record: {}
    interpretation: Empty until reviewed record-specific boundaries are supplied; no boundaries are invented.
query_metadata: data/e11e81/benchmark_queries/query_metadata.yaml
outputs:
  canonical_event_table: outputs/results/canonical_event_table.csv
  profile_manifest: outputs/results/profile_manifest.json
  profile_graphs: outputs/profile_graphs
  query_results: outputs/results/query_results_by_profile.csv
  retrieval_metrics: outputs/results/retrieval_metrics_by_profile.csv
  query_burden: outputs/results/query_burden_by_profile.csv
  profile_deltas: outputs/results/profile_result_deltas.csv
  record_divergence: outputs/results/record_level_divergence.csv
  divergence_stability: outputs/results/divergence_leave_one_record_out.csv
  profile_pair_divergence: outputs/results/profile_pair_divergence.csv
  event_kind_review: outputs/results/event_kind_review.csv
  event_kind_review_summary: outputs/results/event_kind_review_summary.json
